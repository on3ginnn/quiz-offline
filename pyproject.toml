[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiz-offline"
version = "0.1.0"
description = "Офлайн-проигрыватель пакетов quiz и конструктор тестов для администраторов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
quiz-offline = "quiz_offline.main:main"
quiz-admin = "quiz_admin.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quiz_offline*", "quiz_admin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
